{% extends "setup_base.html" %}
{% block content %}
  <div>
    <h1>Select your wifi network</h1>
  </div>
  <div class="list">
    {% for point in points %}
      <a class="net" href="confirm?ssid={{ point.ssid_encoded }}&encrypted={{ point.security }}">
        <span class="name">{{ point.ssid }}</span>
        {% if point.security == 'encrypted' %}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" role="img" aria-label="Password protected"><rect x="5" y="11" width="14" height="10"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        {% endif %}
      </a>
    {% else %}
      <div class="empty">No networks found yet. Pull down or reload to check again.</div>
    {% endfor %}
  </div>
  <a class="btn quiet" href="/">Scan again</a>
{% endblock %}
